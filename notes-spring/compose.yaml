services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        GIT_SHA: local
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: notes
      DB_USER: notes
      DB_PASSWORD: notes
      APP_COLOR: "${APP_COLOR:-#1f6feb}"
      APP_FORCE_UNHEALTHY: "${APP_FORCE_UNHEALTHY:-false}"
      LOG_FORMAT: text
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
