spring:
  application:
    name: notes
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notes}
    username: ${DB_USER:notes}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

app:
  name: notes
  color: ${APP_COLOR:#1f6feb}
  force-unhealthy: ${APP_FORCE_UNHEALTHY:false}
  release:
    git-sha: ${GIT_SHA:unknown}
    built-at: ${BUILT_AT:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    ecs:
      service:
        name: ${spring.application.name}
