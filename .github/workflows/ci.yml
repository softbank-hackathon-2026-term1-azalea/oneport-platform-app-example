name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes-fastapi:
    name: notes-fastapi
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: notes-fastapi

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: notes-fastapi/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app tests

      - name: Test
        run: uv run pytest -q

      - name: Build image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA="$GITHUB_SHA" -t notes-fastapi:ci .

  notes-spring:
    name: notes-spring
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: notes-spring

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA="$GITHUB_SHA" -t notes-spring:ci .
